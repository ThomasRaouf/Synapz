<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width", initial-scale="1.0">
    <title>Stnapz - Reset Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-logo">SYNAPZ</div>
        <h1 class="auth-title">Set a new password</h1>
        <p class="auth-subtitle">Please enter your new password below</p>
        <div id="auth-error" class="auth-error"></div>
        <div id="auth-success" class="auth-success"></div>

        <div id="reset-content" style="display: none;">
            <form id="reset-form" class="auth-form">
                <div class="form-group">
                    <label for="password">New Password</label>
                    <input type="password" id="password" required minlength="6" placeholder="********">
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirm New Password</label>
                    <input type="password" id="confirm-password" required minlength="6" placeholder="********">
                </div>

                <button type="submit" class="auth-btn" id="submit-btn">
                    <span class="btn-text">Update Password</span>
                    <span class="btn-loader" style="display: none;"></span>
                </button>
            </form>
        </div>

        <div id="invalid-session" style="display: none;" class="auth-links">
            <p class="auth-error" style="display: block;">The password reset link is invalid or has expired</p>
            <a href="login.html">Back to login</a>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const resetContent = document.getElementById("reset-content");
            const invalidSession = document.getElementById("invalid-session");
            const resetForm = document.getElementById("reset-form");
            const errorDiv = document.getElementById("auth-error");
            const successDiv = document.getElementById("auth-success");
            const submitBtn = document.getElementById("submit-btn");
            const btnText = submitBtn.querySelector(".btn-text");
            const btnLoader = submitBtn.querySelector(".btn-loader");


            supabaseClient.auth.onAuthStateChange((event, session) => {
                if (event === 'PASSWORD_RECOVERY') {
                    resetContent.style.display = "block";
                    invalidSession.style.display = "none";
                } else if (!session) {

                    resetContent.style.display = "none";
                    invalidSession.style.display = "block";
                }
            });

            resetForm.addEventListener("submit", async (e) => {
                e.preventDefault();

                errorDiv.style.display = "none";
                successDiv.style.display = "none";

                const password = document.getElementById("password").value;
                const confirmPassword = document.getElementById("confirm-password").value;

                if (password !== confirmPassword) {
                    errorDiv.textContent = "Passwords do not match.";
                    errorDiv.style.display = "block";
                    return;
                }

                submitBtn.disabled = true;
                btnText.textContent = "Updating...";
                btnLoader.style.display = "inline-block";

                try {
                    const { error } = await updatePassword(password);
                    if (error) throw error;

                    successDiv.textContent = "Password updated successfully. You can now log in with your new password.";
                    successDiv.style.display = "block";
                    resetForm.reset();
                    resetContent.style.display = "none";


                    invalidSession.innerHTML = '<a href="login.html">Back to login</a>';
                    invalidSession.style.display = "block";
                    invalidSession.querySelector('.auth-error')?.remove();

                } catch (err) {
                    errorDiv.textContent = err.message || "Failed to update password. Please try again.";
                    errorDiv.style.display = "block";
                } finally {
                    submitBtn.disabled = false;
                    btnText.textContent = "Update Password";
                    btnLoader.style.display = "none";
                }
            });
        });
    </script>
</body>
</html>
