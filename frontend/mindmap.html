<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synapz - Interactive Mind Map</title>
    <!-- Link to CSS file -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/mindmap.css">
</head>
<body>
    <div class="mindmap-layout">

        <!-- Canvas area for mind map tree -->
         <main class="mindmap-canvas">
            <div class="tree" id="mindmap-tree">

            </div>
         </main>

         <!-- Sidebar to display explanations -->
        <aside class="mindmap-sidebar">
            <h3>Concept Details</h3>
            <div class="explanation-box">
                <h4 id="explanation-title">Select a concept</h4>
                <p id="explanation-desc"> Click on any node on the mindmap to expand/collapse its branches and view its explanation here.</p>
            </div>
        </aside>
    </div>

    <!-- Link to the JS file -->
     <script src="js/mindmap.js"></script>
</body>
</html>
