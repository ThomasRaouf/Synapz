<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synapz - Forgot Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-logo">SYNAPZ</div>
        <h1 class="auth-title">Reset your password</h1>
        <p class="auth-subtitle">Enter your email and we'll send you a reset link.</p>
        <div id="auth-error" class="auth-error"></div>
        <div id="auth-success" class="auth-success"></div>

        <form id="forgot-form" class="auth-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="you@example.com">
            </div>

            <button type="submit" class="auth-btn" id="submit-btn">
                <span class="btn-text">Send Reset Link</span>
                <span class="btn-loader" style="display: none;"></span>
            </button>
        </form>

        <div class="auth-links">
            <a href="login.html">Back to login</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const forgotForm = document.getElementById("forgot-form");
            const errorDiv = document.getElementById("auth-error");
            const successDiv = document.getElementById("auth-success");
            const submitBtn = document.getElementById("submit-btn");
            const btnText = submitBtn.querySelector(".btn-text");
            const btnLoader = submitBtn.querySelector(".btn-loader");

            forgotForm.addEventListener("submit", async (e) => {
                e.preventDefault();

                errorDiv.style.display = "none";
                successDiv.style.display = "none";

                submitBtn.disabled = true;
                btnText.textContent = "Sending...";
                btnLoader.style.display = "inline-block";

                const email = document.getElementById("email").value;
                const redirectUrl = new URL("reset-password.html", window.location.href).href;

                try {
                    const { error } = await sendPasswordReset(email, redirectUrl);
                    if (error) throw error;

                    successDiv.innerHTML = "Check your email<br><br>If an account exists for that address, we've sent a password reset link.";
                    successDiv.style.display = "block";
                    forgotForm.reset();
                } catch (err) {

                    console.error("Password reset error:", err);
                    errorDiv.textContent = "An error occurred while processing your request. Please try again.";
                    errorDiv.style.display = "block";
                } finally {
                    submitBtn.disabled = false;
                    btnText.textContent = "Send Reset Link";
                    btnLoader.style.display = "none";
                }
            });
        });
    </script>
</body>
</html>
