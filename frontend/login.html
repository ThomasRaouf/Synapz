<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Synapz - Log In</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/main.css">
        <link rel="stylesheet" href="css/auth.css">
    </head>
    <body>
        <div class="auth-container">
            <div class="auth-logo">SYNAPZ</div>
            <h1 class="auth-title">Welcome back to Synapz</h1>
            <p class="auth-subtitle">Log in to access your study materials.</p>
            <div id="auth-error" class="auth-error"></div>
            <div id="auth-success" class="auth-success"></div>

            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="********">
                </div>

                <button type="submit" class="auth-btn" id="submit-btn">
                    <span class="btn-text">Log In</span>
                    <span class="btn-loader" style="display: none;"></span>
                </button>
            </form>

            <div class="auth-links">
                <a href="forgot-password.html">Forgot password?</a>
                <span>Don't have an account? <a href="signup.html">Create one</a> </span>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="js/supabase-client.js"></script>
        <script src="js/auth.js"></script>
        <script>
            document.addEventListener("DOMContentLoaded", async () => {

                const session = await getCurrentSession();
                if (session) {
                    window.location.href = "index.html";
                    return;
                }

                const loginForm = document.getElementById("login-form");
                const errorDiv = document.getElementById("auth-error");
                const submitBtn = document.getElementById("submit-btn");
                const btnText = submitBtn.querySelector(".btn-text");
                const btnLoader = submitBtn.querySelector(".btn-loader")

                loginForm.addEventListener("submit", async (e) => {
                    e.preventDefault();

                    errorDiv.style.display = "none";
                    submitBtn.disabled = true;
                    btnText.textContent = "Logging in...";
                    btnLoader.style.display = "inline-block";

                    const email = document.getElementById("email").value;
                    const password = document.getElementById("password").value;

                    try {
                        const { error } = await signInUser(email, password);
                        if (error) throw error;

                        window.location.href = "index.html";
                    } catch (err) {
                        errorDiv.textContent = err.message || "Invalid credentials. Please try again.";
                        errorDiv.style.display = "block";

                        submitBtn.disabled = false;
                        btnText.textContent = "Log In";
                        btnLoader.style.display = "none";
                    }
                });
            });
        </script>
    </body>
</html>
